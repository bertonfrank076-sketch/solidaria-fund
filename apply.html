<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Faire une demande | Solidaria Fund</title><link rel="stylesheet" href="assets/style.css"></head><body>
<header class="top inner"><a class="logo" href="index.html"><span>SOLIDARIA</span><b>FUND</b></a><a class="back" href="index.html">← Retour</a></header>
<main class="apply"><div class="apply-head"><small>SOLIDARIA FUND / DEMANDE</small><h1>Faites votre<br><em>demande.</em></h1><p>Remplissez les informations ci-dessous. Une demande reçue ne constitue pas une promesse de financement.</p></div>
<form id="applicationForm"><div class="row"><label>Prénom<input name="firstName" required></label><label>Nom<input name="lastName" required></label></div><div class="row"><label>Pays<input name="country" required></label><label>WhatsApp<input name="whatsapp" required placeholder="+XX XXX XXX XXX"></label></div><div class="row"><label>E-mail<input type="email" name="email" required></label><label>Programme<select name="program"><option>Programme familial</option><option>Projet familial</option><option>Étude personnalisée</option></select></label></div><label>Montant souhaité (€)<input type="number" name="amount" min="0" step="1000"></label><label>Votre situation / votre demande<textarea name="message" rows="7"></textarea></label><label class="consent"><input type="checkbox" required> J'accepte que les informations transmises soient utilisées pour répondre à ma demande.</label><button class="cta" type="submit">Envoyer ma demande →</button><div id="formMessage" class="success" hidden></div></form></main>
<script src="assets/i18n.js"></script><script src="assets/app.js"></script></body></html>
