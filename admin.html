<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration | Solidaria Fund</title><link rel="stylesheet" href="assets/style.css"></head><body class="admin-page">
<header class="top inner"><a class="logo" href="index.html"><span>SOLIDARIA</span><b>FUND</b></a><span>ADMINISTRATION</span></header>
<main class="dashboard" id="login"><div class="login-card"><small>ESPACE PROTÉGÉ</small><h1>Connexion</h1><form id="loginForm"><input id="user" placeholder="Identifiant" required><input id="pass" type="password" placeholder="Mot de passe" required><button class="cta">Se connecter</button></form><p class="demo">Démo locale : admin / change-me</p></div></main>
<main class="dashboard" id="dash" hidden><div class="dash-head"><div><small>TABLEAU DE BORD</small><h1>Demandes reçues</h1></div><button id="logout">Déconnexion</button></div><div class="metrics"><div><small>VISITEURS</small><b id="v">0</b></div><div><small>DEMANDES</small><b id="t">0</b></div><div><small>NOUVELLES</small><b id="n">0</b></div><div><small>PAYS</small><b id="c">0</b></div></div><div class="tools"><input id="search" placeholder="Rechercher un nom, pays ou numéro…"><button id="export">Exporter CSV</button></div><div class="table"><table><thead><tr><th>Date</th><th>Demandeur</th><th>Pays</th><th>WhatsApp</th><th>Programme</th><th>Statut</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></main>
<script>
const K='sf_requests_v2',V='sf_visitors_v2',$=x=>document.querySelector(x),data=()=>JSON.parse(localStorage.getItem(K)||'[]');
function render(){let a=data(),q=($('#search').value||'').toLowerCase();$('#v').textContent=localStorage.getItem(V)||0;$('#t').textContent=a.length;$('#n').textContent=a.filter(x=>x.status==='new').length;$('#c').textContent=new Set(a.map(x=>x.country)).size;$('#rows').innerHTML=a.filter(x=>(x.firstName+' '+x.lastName+' '+x.country+' '+x.whatsapp).toLowerCase().includes(q)).map(x=>`<tr><td>${new Date(x.date).toLocaleString()}</td><td>${x.firstName} ${x.lastName}</td><td>${x.country}</td><td>${x.whatsapp}</td><td>${x.program}</td><td><select onchange="st('${x.id}',this.value)"><option ${x.status==='new'?'selected':''}>new</option><option ${x.status==='processed'?'selected':''}>processed</option></select></td><td><button onclick="show('${x.id}')">Voir</button><button onclick="del('${x.id}')">×</button></td></tr>`).join('')}
function st(id,v){let a=data(),x=a.find(x=>x.id===id);if(x)x.status=v;localStorage.setItem(K,JSON.stringify(a));render()}
function show(id){let x=data().find(x=>x.id===id);if(x)alert(JSON.stringify(x,null,2))}
function del(id){if(confirm('Supprimer ?')){localStorage.setItem(K,JSON.stringify(data().filter(x=>x.id!==id)));render()}}
$('#loginForm').onsubmit=e=>{e.preventDefault();if($('#user').value==='admin'&&$('#pass').value==='change-me'){sessionStorage.sf='1';$('#login').hidden=true;$('#dash').hidden=false;render()}else alert('Identifiants incorrects')};
$('#logout').onclick=()=>{sessionStorage.removeItem('sf');location.reload()};$('#search').oninput=render;
$('#export').onclick=()=>{let a=data(),head=['date','firstName','lastName','country','whatsapp','email','program','amount','message','status'],csv=[head.join(','),...a.map(x=>head.map(k=>`"${String(x[k]??'').replaceAll('"','""')}"`).join(','))].join('\\n'),u=URL.createObjectURL(new Blob([csv],{type:'text/csv'})),a1=document.createElement('a');a1.href=u;a1.download='solidaria-fund-demandes.csv';a1.click();URL.revokeObjectURL(u)};
if(sessionStorage.sf){$('#login').hidden=true;$('#dash').hidden=false;render()}
</script></body></html>
